<!doctype html><html lang="vi"><head><script src="./onax-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111116"><title>Key nhận điểm — ONAX MOD Z</title><style>:root{color-scheme:dark;--bg:#111116;--panel:#1b1b23;--line:#30303a;--muted:#a1a1b0;--text:#f1f1f6;--accent:#b29aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}a{color:var(--accent);text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.shell{width:min(700px,calc(100% - 36px));margin:auto}header{padding:24px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}h1{font-size:28px;margin:30px 0 5px}.fish-account form{flex-direction:column!important;align-items:stretch!important}.fish-account label{width:100%}</style><style>.fish-account{margin:24px 0;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.fish-account h2{font-size:18px;margin:0}.fish-account p{color:var(--muted);font-size:13px}.fish-account form{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.fish-account label{display:grid;gap:5px;font-size:13px;flex:1;min-width:180px}.fish-account input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}.fish-actions{display:flex;flex-wrap:wrap;gap:8px}.fish-actions button{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#282334}.fish-account [hidden]{display:none!important}#fish-auth-status:empty{display:none}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="./fish-key.js"></script><meta name="referrer" content="no-referrer"></head><body><div class="shell"><header><strong>ONAX MOD Z</strong><a href="./earn.html">← Nhận điểm</a></header><main><h1>Key nhận điểm</h1><section class="fish-account"><p id="fish-key-status" role="status" aria-live="polite">Đang tải key…</p><label id="fish-key-display-wrap" hidden>Key của bạn<input id="fish-key-display" readonly aria-label="Key nhận điểm"></label><div class="fish-actions"><button id="fish-key-copy" type="button" hidden>Sao chép key</button></div><p>Quay lại mục Nhận điểm, đăng nhập đúng tài khoản đã mở nhiệm vụ rồi nhập key để nhận 2 điểm.</p><a href="./earn.html">Quay lại nhập key</a></section></main></div></body></html>
