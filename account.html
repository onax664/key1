<!doctype html><html lang="vi"><head><script src="./onax-config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111116"><title>Tài khoản — ONAX MOD Z</title><style>:root{color-scheme:dark;--bg:#111116;--panel:#1b1b23;--line:#30303a;--muted:#a1a1b0;--text:#f1f1f6;--accent:#b29aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}a{color:var(--accent);text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.shell{width:min(700px,calc(100% - 36px));margin:auto}header{padding:24px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}h1{font-size:28px;margin:30px 0 5px}.fish-account form{flex-direction:column!important;align-items:stretch!important}.fish-account label{width:100%}</style><style>.fish-account{margin:24px 0;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.fish-account h2{font-size:18px;margin:0}.fish-account p{color:var(--muted);font-size:13px}.fish-account form{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.fish-account label{display:grid;gap:5px;font-size:13px;flex:1;min-width:180px}.fish-account input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}.fish-actions{display:flex;flex-wrap:wrap;gap:8px}.fish-actions button{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#282334}.fish-account [hidden]{display:none!important}#fish-auth-status:empty{display:none}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="./fish-account.js"></script></head><body><div class="shell"><header><strong>ONAX MOD Z</strong><a href="./index.html">← Quay lại phối đồ</a></header><main><h1>Tài khoản</h1><section class="fish-account" aria-label="Tài khoản">
<div id="fish-guest"><h2>Tài khoản ONAX MOD Z</h2><p>Đăng nhập để xem số điểm của bạn.</p>
<form id="fish-login-form"><label id="fish-username-label">Tên tài khoản<input id="fish-username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,24}" minlength="3" maxlength="24" required><small>3–24 ký tự: chữ không dấu, số hoặc dấu _.</small></label><label>Mật khẩu<input id="fish-password" type="password" autocomplete="current-password" required></label><label id="fish-password-confirm-label" hidden>Nhập lại mật khẩu<input id="fish-password-confirm" type="password" autocomplete="new-password" disabled></label><div class="fish-actions"><button type="submit" id="fish-submit">Đăng nhập</button><button type="button" id="fish-register">Đăng ký</button><button type="button" id="fish-google">Đăng nhập Google</button></div></form></div>
<div id="fish-member" hidden><strong id="fish-user"></strong><p>ID người dùng: <code id="fish-user-id" style="overflow-wrap:anywhere;user-select:all"></code></p><div class="fish-actions"><button id="fish-copy-id" type="button">Sao chép ID</button></div><p>Ngày tạo tài khoản: <time id="fish-created-at"></time></p><p>Số điểm: <strong id="fish-points">Đang tải…</strong></p><div class="fish-actions"><button id="fish-refresh" type="button">Cập nhật điểm</button><button id="fish-signout" type="button">Đăng xuất</button></div></div>
<form id="fish-name-form" hidden><label>Đặt tên tài khoản<input id="fish-new-username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,24}" minlength="3" maxlength="24" required></label><div class="fish-actions"><button type="submit">Lưu tên tài khoản</button></div></form><p id="fish-auth-status" role="status" aria-live="polite"></p>
</section></main></div></body></html>
